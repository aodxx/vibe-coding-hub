<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06c755">
  <title>LINE Mini App Starter</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="config.js"></script>
  <script defer src="api.js"></script>
  <script defer src="line-auth.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <section id="loading" class="state-panel" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>กำลังเชื่อมต่อ LINE…</p>
    </section>

    <section id="error-panel" class="state-panel error-panel" hidden>
      <h1>เปิดแอปไม่สำเร็จ</h1>
      <p id="error-message"></p>
      <button id="retry-button" type="button">ลองอีกครั้ง</button>
    </section>

    <div id="app" hidden>
      <header class="hero">
        <div>
          <p class="eyebrow">LINE MINI APP STARTER</p>
          <h1>บันทึกรายการ</h1>
        </div>
        <div class="profile">
          <img id="profile-image" alt="" hidden>
          <span id="profile-name">ผู้ใช้ LINE</span>
        </div>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">เพิ่มรายการใหม่</h2>
        <form id="record-form">
          <label for="title">ชื่อรายการ</label>
          <input id="title" name="title" maxlength="100" autocomplete="off" required>

          <label for="amount">จำนวนเงิน</label>
          <input id="amount" name="amount" type="number" min="0" max="1000000000" step="0.01" inputmode="decimal" required>

          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" maxlength="500" rows="3"></textarea>

          <button id="submit-button" type="submit">บันทึกรายการ</button>
          <p id="form-status" class="form-status" aria-live="polite"></p>
        </form>
      </section>

      <section class="records" aria-labelledby="records-title">
        <div class="section-heading">
          <h2 id="records-title">รายการของฉัน</h2>
          <span>ล่าสุดอยู่บน</span>
        </div>
        <p id="empty-state" class="empty-state" hidden>ยังไม่มีรายการ เริ่มบันทึกรายการแรกได้เลย</p>
        <div id="record-list" class="record-list" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <noscript>แอปนี้ต้องเปิด JavaScript</noscript>
</body>
</html>
